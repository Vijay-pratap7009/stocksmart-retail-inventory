# =============================================================================
# StockSmart — containerized stack (Day 7)
#   Browser → frontend (Angular + Nginx) → backend (Spring Boot) → oracle (XE)
#
# Usage:
#   cp .env.example .env      # fill DB_PASSWORD + JWT_SECRET (required)
#   docker compose up -d --build
#   docker compose ps         # health: oracle → backend → frontend
#
# ARM64/aarch64 hosts: Oracle XE 21c is amd64-only — add the override:
#   docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d --build
#
# Persistence: named volume `oracle-data` (survives restarts; delete it ONLY to
# intentionally reset the database). Schema is JPA-managed (ddl-auto: update).
# =============================================================================
services:
  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: stocksmart-oracle
    environment:
      ORACLE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
      APP_USER: ${DB_USERNAME:-stocksmart}
      APP_USER_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      # Host access for SQL tools / the native backend. Remove in production if
      # the database must not be reachable from outside the stack.
      - "${DB_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      # gvenzl's script is a real readiness probe: PDB open in READ WRITE mode.
      test: ["CMD", "healthcheck.sh", "XEPDB1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - stocksmart-net

  backend:
    build:
      context: ./backend
    image: stocksmart-backend:${IMAGE_TAG:-dev}
    container_name: stocksmart-backend
    # Waits for Oracle readiness (real health, never a fixed sleep).
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_HOST: oracle
      DB_PORT: 1521
      DB_SERVICE: ${DB_SERVICE:-XEPDB1}
      DB_USERNAME: ${DB_USERNAME:-stocksmart}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — openssl rand -base64 48}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_PASSWORD: ${APP_SEED_PASSWORD:-Admin@123}
    ports:
      - "8080:8080"
    # Health check comes from the image (curl /api/v1/health) — see backend/Dockerfile.
    restart: unless-stopped
    networks:
      - stocksmart-net

  frontend:
    build:
      context: ./frontend
    image: stocksmart-frontend:${IMAGE_TAG:-dev}
    container_name: stocksmart-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Nginx upstream for /api/* — container-to-container, never the browser.
      BACKEND_URL: ${BACKEND_URL:-backend:8080}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    restart: unless-stopped
    networks:
      - stocksmart-net

networks:
  stocksmart-net:
    driver: bridge

volumes:
  oracle-data:
