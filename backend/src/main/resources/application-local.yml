# =============================================================================
# Profile: local — zero-dependency local run (H2 in-memory).
# Oracle remains primary (see application.yml + docker-compose.yml).
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=local
# =============================================================================
spring:
  datasource:
    url: jdbc:h2:mem:stocksmart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
